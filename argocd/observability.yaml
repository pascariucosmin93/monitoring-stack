# Se aplică o singură dată, manual: kubectl apply -f argocd/observability.yaml
# Stack-ul de observabilitate (Grafana, Prometheus, Loki, Tempo, Alloy, OTel Collector).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pascariucosmin93/monitoring-stack.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
