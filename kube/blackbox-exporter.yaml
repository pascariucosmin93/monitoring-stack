apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      # Nodul master rulează API server-ul k3s (SQLite/kine) și are I/O saturat; nu pune aici
      # workload-uri care scriu mult pe disc.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.29.1
          args: ["--config.file=/etc/blackbox/blackbox.yml"]
          ports:
            - containerPort: 9115
          readinessProbe:
            httpGet: { path: /-/healthy, port: 9115 }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/blackbox }
      volumes:
        - name: config
          configMap:
            name: blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  selector:
    app: blackbox-exporter
  ports:
    - port: 9115
      targetPort: 9115
