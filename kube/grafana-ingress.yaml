# Acces intern la Grafana: DNS privat *.kube.cosmin.home (PowerDNS) -> bastion -> Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.kube.cosmin.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
