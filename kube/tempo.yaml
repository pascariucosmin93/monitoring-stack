apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-wal
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      # Nodul master rulează API server-ul k3s (SQLite/kine) și are I/O saturat; nu pune aici
      # workload-uri care scriu mult pe disc.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.10.10
          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -config.expand-env=true
          env:
            - name: TEMPO_R2_ENDPOINT
              valueFrom:
                secretKeyRef: { name: tempo-r2, key: endpoint }
            - name: TEMPO_R2_BUCKET
              valueFrom:
                secretKeyRef: { name: tempo-r2, key: bucket }
            - name: TEMPO_R2_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: tempo-r2, key: access_key }
            - name: TEMPO_R2_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: tempo-r2, key: secret_key }
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: wal, mountPath: /var/tempo }
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: wal
          persistentVolumeClaim:
            claimName: tempo-wal
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
spec:
  selector:
    app: tempo
  ports:
    - { name: http, port: 3200, targetPort: 3200 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
