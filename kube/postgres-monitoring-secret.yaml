apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-monitoring
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: postgres-monitoring
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: postgress_dsn
      remoteRef:
        key: prod/observability/observability_monitor
        property: postgress_dsn
    - secretKey: postgress_1_dsn
      remoteRef:
        key: prod/observability/observability_monitor
        property: postgress_1_dsn
