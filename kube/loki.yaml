apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      # Nodul master rulează API server-ul k3s (SQLite/kine) și are I/O saturat; nu pune aici
      # workload-uri care scriu mult pe disc.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.7.9
          # Cheile R2 se citesc direct din mediu (-config.expand-env).
          args:
            - -config.file=/etc/loki/loki.yaml
            - -config.expand-env=true
          env:
            - name: LOKI_R2_ENDPOINT
              value: 470230c8048951bbfd14594f174bb227.r2.cloudflarestorage.com
            - name: LOKI_R2_BUCKET
              value: loki-dump
            - name: LOKI_R2_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: loki-r2, key: access_key }
            - name: LOKI_R2_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: loki-r2, key: secret_key }
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
