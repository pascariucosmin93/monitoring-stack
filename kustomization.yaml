# Deploy Kubernetes (Argo CD, path: .).
# kustomize permite fișiere doar de sub directorul acestui fișier, de aceea kustomization.yaml e la rădăcină
# și configurile din configs/ sunt incluse prin configMapGenerator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - kube/namespace.yaml
  - kube/rbac.yaml
  - kube/prometheus.yaml
  - kube/postgres-exporter.yaml
  - kube/postgres-monitoring-secret.yaml
  - kube/loki.yaml
  - kube/tempo.yaml
  - kube/kube-state-metrics.yaml
  - kube/otel-collector.yaml
  - kube/blackbox-exporter.yaml
  - kube/node-exporter.yaml
  - kube/alloy.yaml
  - kube/grafana.yaml
  - kube/grafana-ingress.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=configs/prometheus/prometheus.yml
  - name: postgres-exporter-config
    files:
      - sql-exporter.yml=configs/postgres/sql-exporter.yml
  - name: loki-config
    files:
      - loki.yaml=configs/loki/loki.yaml
  - name: tempo-config
    files:
      - tempo.yaml=configs/tempo/tempo.yaml
  - name: otel-collector-config
    files:
      - config.yaml=configs/otel-collector/config.yaml
  - name: blackbox-config
    files:
      - blackbox.yml=configs/blackbox/blackbox.yml
  - name: alloy-config
    files:
      - config.alloy=configs/alloy/config.alloy
  - name: grafana-datasources
    files:
      - datasources.yaml=configs/grafana/provisioning/datasources/datasources.yaml
  - name: grafana-dashboard-providers
    files:
      - dashboards.yaml=configs/grafana/provisioning/dashboards/dashboards.yaml
  - name: grafana-alerting
    files:
      - alerts.yaml=configs/grafana/provisioning/alerting/alerts.yaml
  - name: grafana-dashboards
    files:
      - configs/grafana/dashboards/cluster-operations.json
      - configs/grafana/dashboards/cluster-resource-usage.json
      - configs/grafana/dashboards/k8s-workloads.json
      - configs/grafana/dashboards/k8s-control-plane.json
      - configs/grafana/dashboards/calculatorgaz-production.json
      - configs/grafana/dashboards/calculatorgaz-traces.json
      - configs/grafana/dashboards/calculatorgaz-rum.json
      - configs/grafana/dashboards/calculatorgaz-logs.json
  - name: grafana-dashboards-proxmox
    files:
      - configs/grafana/dashboards/proxmox-storage-guests.json
      - configs/grafana/dashboards/proxmox-disk-smart.json
  - name: grafana-dashboards-infra
    files:
      - configs/grafana/dashboards/infra-runner-backups.json
      - configs/grafana/dashboards/postgres-internals.json

patches:
  - path: kube/hardening.yaml
