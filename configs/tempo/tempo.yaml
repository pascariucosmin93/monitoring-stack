server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 15m

# RED metrics are generated by the OpenTelemetry Collector's spanmetrics
# connector before tail sampling. Tempo's metrics-generator is deliberately not
# enabled: it would only see sampled traces and overstate error rates.

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      bucket: ${TEMPO_R2_BUCKET}
      endpoint: ${TEMPO_R2_ENDPOINT}
      access_key: ${TEMPO_R2_ACCESS_KEY}
      secret_key: ${TEMPO_R2_SECRET_KEY}
      forcepathstyle: true
      insecure: false

usage_report:
  reporting_enabled: false
