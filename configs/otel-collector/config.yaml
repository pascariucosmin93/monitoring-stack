receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 64
  tail_sampling:
    decision_wait: 10s
    num_traces: 5000
    expected_new_traces_per_sec: 20
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow-requests
        type: latency
        latency: { threshold_ms: 1000 }
      - name: baseline-sample
        type: probabilistic
        probabilistic: { sampling_percentage: 5 }
  attributes/sanitize:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.full
        action: delete
      - key: url.path
        action: delete
      - key: http.target
        action: delete
      - key: http.url
        action: delete
  batch:
    timeout: 5s
    send_batch_size: 512

# RED metrics must be computed from every span, before tail sampling keeps
# all errors and slow requests but only 5% of the rest. Generating them after
# sampling (as Tempo's metrics-generator would) inflates error rates and p95.
connectors:
  spanmetrics:
    namespace: traces.spanmetrics
    metrics_flush_interval: 30s
    # Drop series of routes that have not been seen for an hour.
    metrics_expiration: 1h
    histogram:
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    # HTTP route is a framework route template (for example /api/readings),
    # not a request URL. Full URLs and paths are removed before this point.
    dimensions:
      - name: http.route
      - name: http.request.method
      - name: http.response.status_code
  forward/sampling:

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize]
      exporters: [spanmetrics, forward/sampling]
    traces/sampled:
      receivers: [forward/sampling]
      processors: [tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [prometheus]
