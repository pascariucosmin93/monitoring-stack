global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kubernetes-nodes
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: (.*):.*
        replacement: ${1}:9100
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels: [__meta_kubernetes_node_name]
        target_label: instance

  - job_name: frr-exporter
    static_configs:
      - targets:
          - 192.168.70.4:7473
          - 192.168.70.5:7473
          - 192.168.70.6:7473

server:
  extraArgs:
    enable-feature: remote-write-receiver

  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: proxmox-local-lvm

  remoteWrite:
    - url: http://10.13.13.206:9090/api/v1/write

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  retention: 7d

  service:
    type: LoadBalancer

  serviceAccount:
    create: true
    name: prometheus
